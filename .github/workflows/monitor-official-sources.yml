
name: Monitor Official Admission Sources

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Monitor official sources
        id: monitor
        continue-on-error: true
        run: npm run monitor:sources

      - name: Save monitoring state
        if: always()
        run: |
          if git diff --quiet -- lib/data/monitoring/source-monitor-state.json; then
            echo "No monitoring state changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add lib/data/monitoring/source-monitor-state.json

            git commit -m "chore: update official source monitoring state"

            git push origin main
          fi

      - name: Report monitoring failure
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "Some or all official source checks failed."
          exit 1
