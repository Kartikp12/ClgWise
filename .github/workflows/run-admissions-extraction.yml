
name: Run Admissions Extraction Pipeline

on:
  schedule:
    - cron: "30 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admissions-extraction-2026-27
  cancel-in-progress: false

jobs:
  extract-admissions:
    name: Extract and Validate Admissions Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run admissions extraction pipeline
        run: npm run extract:admissions

      - name: Verify generated datasets
        if: success()
        run: |
          DATA_DIR="lib/data/admissions/2026-27"

          test -s "$DATA_DIR/institutes.json"
          test -s "$DATA_DIR/cap-round-1.json"
          test -s "$DATA_DIR/master-colleges.json"
          test -s "$DATA_DIR/extraction-report.json"

          node -e "
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('$DATA_DIR/extraction-report.json', 'utf8')
            );

            if (report.status !== 'validated') {
              throw new Error('Extraction report is not validated.');
            }

            console.log('Extraction report validated.');
          "

      - name: Upload extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admissions-extraction-${{ github.run_number }}
          path: |
            lib/data/admissions/2026-27/*.json
            lib/data/admissions/2026-27/.staging-*/extraction-report.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Report pipeline failure
        if: failure()
        run: |
          echo "::error::Admissions extraction pipeline failed. Check the uploaded extraction report and workflow logs."
          exit 1
